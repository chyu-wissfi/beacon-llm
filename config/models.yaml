# 平台模型表：平台模型名 -> 供应商坐标与能力（design.md §5）。
# 启动资产：由 core/config.py 在导入期加载校验，任何字段缺失/类型错 = 启动失败。
# api_key_env 只存环境变量"名字"，loader 不解析其值——key 缺失是运行时
# 503 gateway_misconfigured（provider 层，demo 语义），不算配置错误。
# admission 块是进程级准入阈值（M05，ADR-0004：阈值全部是配置项）；
# 整块可省略，吃 design §3.4 基线默认（全局 20 / 每供应商 10）。
admission:
  global_concurrency: 20
  provider_concurrency: 10
models:
  general-primary:
    provider_model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    # provider_api 标记上游协议族（M04 起 chat / responses 两族，
    # openai_compatible 据此分派传输）。
    provider_api: chat
    # provider 是注册表查表键（M04 任务 5）：显式声明而非吃默认值。
    provider: openai_compatible
    structured_output_mode: json_object
    supports_structured_output: true
    # fallback 链是 M02 的声明式占位：M06 编排层才改为消费此字段，
    # 在此之前 invocation.py 仍按 demo 硬编码"主模型 -> general-backup"。
    fallback: ["general-backup"]
    # 限流参数（M05 起消费）：rpm 是每模型令牌桶容量，tpm 是 60 秒滑动窗口
    # 的事后记账预算；并发超限行为见 admission 块。concurrency（每模型并发）
    # 语义未定暂不消费，保留声明。
    rate_limit:
      rpm: 60
      tpm: 200000
      concurrency: 8
  general-backup:
    provider_model: deepseek-chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_BACKUP_API_KEY
    provider_api: chat
    provider: openai_compatible
    structured_output_mode: json_object
    supports_structured_output: true
    # 备用模型自身没有下一级降级目标：链到此为止。
    fallback: []
    rate_limit:
      rpm: 60
      tpm: 200000
      concurrency: 8
  # ---- 双协议组合：模型开放，协议必须异构 ----
  # 两个条目共用同一中转站 key（api_key_env 指向同一环境变量是合法的：
  # 变量名只是取值坐标，协议差异由 provider/provider_api 承载）。
  vve-gpt-responses:
    provider_model: gpt-5.6-luna
    # OpenAI SDK 在 base_url 后拼 /responses（Responses API），/v1 必须显式带上。
    base_url: https://api.vveai.com/v1
    api_key_env: VVEAI_API_KEY
    provider_api: responses
    provider: openai_compatible
    # Responses API 原生支持 text.format=json_schema 约束。
    structured_output_mode: json_schema
    supports_structured_output: true
    fallback: []
    rate_limit:
      rpm: 60
      tpm: 200000
      concurrency: 8
  vve-claude-anthropic:
    provider_model: claude-sonnet-5
    # Anthropic SDK 在 base_url 后拼 /v1/messages，base_url 不带 /v1。
    base_url: https://api.vveai.com
    api_key_env: VVEAI_API_KEY
    # provider_api 只对 openai_compatible 有意义（anthropic 不消费），吃默认。
    provider_api: chat
    provider: anthropic
    # Anthropic 协议无原生 schema 约束：仅 json_object（schema 注入 system）。
    structured_output_mode: json_object
    supports_structured_output: true
    fallback: []
    rate_limit:
      rpm: 60
      tpm: 200000
      concurrency: 8
