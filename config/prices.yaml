# 价格表：每百万 Token 的美元单价（design.md §5）。
# version 是价格快照的版本标识：成本计算按加载时的表快照计价，
# 版本号进 Trace 属 M09（当前只加载不消费）。
# version 必须加引号：不加引号时 YAML 会把 2026-08-30 解析成日期对象而非字符串。
version: "2026-08-30"
prices:
  general-primary:
    input: 1.0
    output: 4.0
  general-backup:
    input: 0.8
    output: 3.2
  # 双协议组合的牌价：中转站计价与官方牌价可能不同，此处为占位值——
  # 只影响 trace 成本记账，不影响行为；有实际牌价后按需修改。
  vve-gpt-responses:
    input: 1.25
    output: 10.0
  vve-claude-anthropic:
    input: 3.0
    output: 15.0
